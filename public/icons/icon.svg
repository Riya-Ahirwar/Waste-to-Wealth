<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" filter="url(#shadow)" />

  <!-- Eco Leaf / Recycle symbol graphic -->
  <g transform="translate(96, 96) scale(0.625)" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center recycle triangular flow -->
    <path d="M 256 60 L 370 250 L 330 250 L 256 125 L 182 250 L 142 250 Z" fill="#ffffff" stroke="none" />
    <path d="M 440 270 L 380 374 L 350 354 L 390 285 L 280 285 L 280 245 Z" fill="#ffffff" stroke="none" opacity="0.95" />
    <path d="M 72 270 L 232 270 L 232 310 L 122 310 L 162 380 L 132 400 Z" fill="#ffffff" stroke="none" opacity="0.95" />
    <!-- Leaf veins -->
    <circle cx="256" cy="270" r="42" fill="#facc15" stroke="none" />
    <path d="M 256 228 C 280 250 280 290 256 312" stroke="#059669" stroke-width="12" />
  </g>
</svg>
